<div class="container py-4 bg-white" style="min-height: 100vh;">
  <!-- Header -->
  <div class="d-flex align-items-center mb-5">
    <h2 class="fw-bold mb-0" style="font-family: Arial, sans-serif;">ElectroServi <span
        class="fs-5 fw-normal">Inc.</span></h2>
  </div>

  <div class="row justify-content-center mt-5">
    <div class="col-12 col-md-10 col-lg-8">

      <!-- Comentarios -->
      <div class="d-flex align-items-start justify-content-center gap-3 mb-4">
        <label class="form-label text-dark mt-2" style="font-size: 0.95rem; width: 140px; text-align: right;">escriba
          comentarios</label>
        <textarea class="form-control border-secondary rounded-0" rows="10"
          style="width: 500px; resize: none;"></textarea>
      </div>

      <!-- Tipo de reparación -->
      <div class="d-flex align-items-center justify-content-center gap-3 mb-5">
        <label class="form-label mb-0 text-dark" style="font-size: 0.95rem; width: 140px; text-align: right;">Tipo de
          reparacion:</label>
        <select class="form-select border-secondary rounded-0" style="width: 250px;">
          <option value="general">general</option>
          <!-- Additional options can be populated later -->
        </select>
      </div>

      <!-- Botones -->
      <div class="d-flex justify-content-center gap-4 mt-5 pt-3">
        <button class="btn bg-white border border-secondary text-dark rounded-1"
          style="width: 140px; font-size: 0.95rem;" type="button">
          Volver
        </button>
        <button class="btn text-white rounded-1" style="background-color: #1a9ee0; width: 140px; font-size: 0.95rem;"
          type="button">
          finalizar
        </button>
      </div>

    </div>
  </div>
</div>
