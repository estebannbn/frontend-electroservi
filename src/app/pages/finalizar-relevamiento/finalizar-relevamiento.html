<div class="container py-4 bg-white" style="min-height: 100vh;">
    <div class="row justify-content-center mt-5">
      <div class="col-12 col-md-10 col-lg-8">

        <h1 class="h3 fw-bold text-center text-dark mb-4">Finalización del relevamiento</h1>

        @if (errorMessage) {
          <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
        }

        <!-- Comentarios -->
        <div class="d-flex align-items-start justify-content-center gap-3 mb-4">
          <label for="comentariosRelevamiento" class="form-label text-dark mt-2" style="font-size: 0.95rem; width: 140px; text-align: right;">Escriba los comentarios:</label>
          <textarea id="comentariosRelevamiento" name="comentario" class="form-control border-secondary rounded-0"
            rows="10" style="width: 500px; resize: none;" [(ngModel)]="comentario"></textarea>
        </div>

        <!-- Tipo de trabajo -->
        <div class="d-flex align-items-center justify-content-center gap-3 mb-5">
          <label class="form-label mb-0 text-dark" style="font-size: 0.95rem; width: 140px; text-align: right;">Tipo de trabajo:</label>
          <select class="form-select border-secondary rounded-0" style="width: 250px;">
            <option value="general">general</option>
          </select>
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-center gap-4 mt-5 pt-3">
          <button class="btn btn-outline-secondary rounded-1" style="width: 140px; font-size: 0.95rem;"
            type="button" (click)="volverAlMenuTecnico()" [disabled]="enviando">
            Volver
          </button>
          <button class="btn text-white rounded-1" style="background-color: #1a9ee0; width: 140px; font-size: 0.95rem;"
            type="button" (click)="finalizarRelevamiento()" [disabled]="enviando">
            {{ enviando ? 'Enviando...' : 'Enviar' }}
          </button>
        </div>

      </div>
    </div>
</div>
