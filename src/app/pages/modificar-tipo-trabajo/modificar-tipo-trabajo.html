<div class="modificar-tipo-trabajo container py-4">
  <div class="mb-4">
    <button class="btn-menu-back" type="button" (click)="onVolver()">
      &larr; Volver al menú
    </button>
  </div>
  <h1 class="admin-page-title">Administración de tipos de trabajo</h1>

  <div *ngIf="selectedTipoTrabajo" class="edit-card p-4 rounded-4 shadow-sm mb-4 bg-white">
    <h3 class="mb-4 text-center">Modificar tipo de trabajo: {{ selectedTipoTrabajo.nombre }}</h3>
    <div class="row gx-3 gy-3 align-items-end">
      <div class="col-12 col-md-3">
        <label class="form-label">Precio</label>
        <div class="input-group">
          <input type="number" class="form-control" [(ngModel)]="editModel.precio" />
          <span class="input-group-text">$</span>
        </div>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Porcentaje de técnico</label>
        <div class="input-group">
          <input type="number" class="form-control" [(ngModel)]="editModel.porcentajeTecnico"
            (ngModelChange)="actualizarPorcentajeNegocio()" />
          <span class="input-group-text">%</span>
        </div>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Porcentaje de negocio</label>
        <div class="input-group">
          <input type="number" class="form-control" [value]="editModel.porcentajeNegocio" readonly />
          <span class="input-group-text">%</span>
        </div>
      </div>
      <div class="col-12 d-flex justify-content-end gap-2 mt-2">
        <button class="btn btn-secondary" type="button" (click)="cancelarEdicion()">Cancelar</button>
        <button class="btn btn-primary" type="button" (click)="aplicarCambios()">Aplicar</button>
      </div>
    </div>
  </div>

  <div class="list-group tipo-list" *ngIf="!selectedTipoTrabajo">
    <div *ngFor="let tipo of tipoTrabajos" class="tipo-card p-4 rounded-4 shadow-sm mb-3 bg-white">
      <div class="row align-items-center gy-3">
        <div class="col-12 col-md-5">
          <label class="form-label mb-1">Nombre</label>
          <input class="form-control" [value]="tipo.nombre" readonly />
        </div>
        <div class="col-12 col-md-2">
          <label class="form-label mb-1">Precio</label>
          <div class="input-group">
            <input class="form-control" [value]="tipo.precio" readonly />
            <span class="input-group-text">$</span>
          </div>
        </div>
        <div class="col-12 col-md-2">
          <label class="form-label mb-1">Porcentaje técnico</label>
          <div class="input-group">
            <input class="form-control" [value]="tipo.porcentajeTecnico" readonly />
            <span class="input-group-text">%</span>
          </div>
        </div>
        <div class="col-12 col-md-2">
          <label class="form-label mb-1">Porcentaje negocio</label>
          <div class="input-group">
            <input class="form-control" [value]="tipo.porcentajeNegocio" readonly />
            <span class="input-group-text">%</span>
          </div>
        </div>
        <div class="col-12 col-md-2 d-flex justify-content-end">
          <button class="btn btn-outline-primary w-100 btn-modificar-datos" type="button"
            (click)="seleccionarTipo(tipo)">
            Modificar Datos
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
