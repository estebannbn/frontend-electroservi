<div class="container-fluid py-5 d-flex align-items-center justify-content-center">
    <section class="dashboard-panel shadow-lg rounded-4 overflow-hidden w-100" aria-labelledby="technician-panel-title">
        <div class="panel-header bg-primary text-white p-4 text-center">
            <h1 class="mb-0 fw-bold" id="technician-panel-title">Panel del Técnico</h1>
            <p class="text-white-50 mb-0 mt-2">¡Bienvenido {{ tecnicoNombre || '(nombre del técnico)' }}!</p>
            <p class="text-white-50 mb-0 mt-1">Seleccione una opción para continuar</p>
        </div>

        <div class="panel-body p-4 p-md-5 bg-white">
            <div class="list-group gap-3 border-0">
                <button
                    class="menu-btn list-group-item list-group-item-action rounded-3 d-flex align-items-center py-3 px-4 fw-bold border-0 shadow-sm"
                    (click)="goToServicios()">
                    <div class="icon-wrapper bg-success bg-opacity-10 text-success rounded-circle me-3 d-flex align-items-center justify-content-center">
                        <span class="fs-4">🔧</span>
                    </div>
                    <span class="text-dark fs-5">Servicios a cargo</span>
                    <span class="ms-auto text-success fs-5 fw-bold chevron">&rarr;</span>
                </button>

                <button
                    class="menu-btn list-group-item list-group-item-action rounded-3 d-flex align-items-center py-3 px-4 fw-bold border-0 shadow-sm"
                    (click)="goToNotificaciones()">
                    <div class="icon-wrapper bg-info bg-opacity-10 text-info rounded-circle me-3 d-flex align-items-center justify-content-center">
                        <span class="fs-4">🔔</span>
                    </div>
                    <span class="text-dark fs-5">Notificaciones</span>
                    <span class="ms-auto text-info fs-5 fw-bold chevron">&rarr;</span>
                </button>
            </div>
        </div>
    </section>
</div>
