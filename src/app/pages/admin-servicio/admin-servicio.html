<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-5">
    <h2 class="fw-bold mb-0">ElectroServi <span class="fs-6 fw-normal">Inc.</span></h2>
  </div>

  <div *ngIf="!hasSearched">
    <h3 class="text-center fw-bold mb-5">Menu de servicios</h3>

    <div class="d-flex justify-content-center align-items-center gap-3 mb-5">
      <input type="number" class="form-control w-auto" style="min-width: 250px;"
        placeholder="Ingrese codigo de servicio..." [(ngModel)]="searchId" (keyup.enter)="buscarServicios()">
      <span class="fw-bold mx-2">o</span>
      <input type="email" class="form-control w-auto" style="min-width: 280px;"
        placeholder="Ingrese email asociado a servicio..." [(ngModel)]="searchEmail" (keyup.enter)="buscarServicios()">
    </div>

    <div class="text-center">
      <button class="btn btn-outline-secondary px-5" (click)="buscarServicios()">Buscar</button>
    </div>
  </div>

  <div *ngIf="hasSearched">
    <button class="btn btn-outline-secondary mb-4" routerLink="/admin">&lt;-- volver a menu de administrador</button>

    <h3 class="text-center fw-bold mb-5">Servicios encontrados</h3>

    <div *ngIf="servicios && servicios.length > 0; else noResults">
      <div class="card mb-3 bg-light" *ngFor="let s of servicios">
        <div class="card-body d-flex justify-content-between align-items-center py-2">
          <div class="d-flex flex-wrap gap-3 align-items-center w-100" style="font-size: 0.9rem;">
            <div class="d-flex align-items-center gap-1">
              <span class="text-dark">Tipo de electrodomestico:</span>
              <input type="text" class="form-control form-control-sm bg-white" readonly
                [value]="s.electrodomestico?.tipo || ''">
            </div>
            <div class="d-flex align-items-center gap-1">
              <span class="text-dark">marca:</span>
              <input type="text" class="form-control form-control-sm bg-white" readonly
                [value]="s.electrodomestico?.marca || ''">
            </div>
            <div class="d-flex align-items-center gap-1">
              <span class="text-dark">modelo:</span>
              <input type="text" class="form-control form-control-sm bg-white" readonly
                [value]="s.electrodomestico?.modelo || ''">
            </div>
            <div class="d-flex align-items-center gap-1">
              <span class="text-dark">Email:</span>
              <input type="text" class="form-control form-control-sm bg-white" readonly
                [value]="s.trabajos?.[0]?.tecnico?.usuario?.mail || ''">
            </div>
            <div class="d-flex align-items-center gap-1">
              <span class="text-dark">en curso:</span>
              <input type="text" class="form-control form-control-sm bg-white text-center px-1" style="width: 40px;"
                readonly [value]="isEnCurso(s.estado)">
            </div>
          </div>
          <div class="ms-3">
            <button class="btn btn-outline-secondary btn-sm text-nowrap rounded-pill px-3">Modificar Datos</button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #noResults>
      <div class="alert alert-warning text-center">No se encontraron servicios.</div>
    </ng-template>
  </div>
</div>
