<div class="container-fluid p-4">
    <!-- Header -->
    <div class="mb-4">
        <h2 class="fw-bold mb-2">ElectroServi <span class="fs-5 fw-normal">Inc.</span></h2>
        <button class="btn btn-outline-secondary btn-sm" (click)="volver()">
            &lt;-- volver a menu de técnico
        </button>
    </div>

    <!-- Title -->
    <div class="text-center mb-5">
        <h3 class="fw-bold">Servicios a cargo</h3>
    </div>

    <!-- Services List -->
    <div class="d-flex flex-column align-items-center gap-3">
        <div *ngFor="let servicio of servicios" class="w-100 d-flex justify-content-center">
            <div class="bg-light border px-3 py-2 d-flex align-items-center justify-content-between" style="width: 90%; max-width: 1200px;">
                <div class="d-flex align-items-center gap-4 flex-wrap">
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-muted small">Electrodomestico:</span>
                        <input type="text" class="form-control form-control-sm bg-white" style="width: 150px;" [value]="servicio.electrodomestico?.tipo || ''" readonly>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-muted small">Modelo:</span>
                        <input type="text" class="form-control form-control-sm bg-white" style="width: 150px;" [value]="servicio.electrodomestico?.modelo || ''" readonly>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-muted small">Marca:</span>
                        <input type="text" class="form-control form-control-sm bg-white" style="width: 150px;" [value]="servicio.electrodomestico?.marca || ''" readonly>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-muted small">Fecha-Hora asignación:</span>
                        <input type="text" class="form-control form-control-sm bg-white" style="width: 180px;" [value]="(servicio.fechaLlegadaEstimada | date:'dd/MM/yyyy HH:mm:ss') || ''" readonly>
                    </div>
                </div>
                
                <button class="btn btn-outline-secondary btn-sm px-4 ms-3" (click)="relevar(servicio)">
                    relevar
                </button>
            </div>
        </div>

        <div *ngIf="servicios.length === 0" class="text-muted text-center mt-4">
            No tienes servicios asignados.
        </div>
    </div>
</div>
