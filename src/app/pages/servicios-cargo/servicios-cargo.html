<div class="container-fluid p-4">
    <!-- Header -->
    <div class="mb-4">
        <button class="btn-menu-back" (click)="volver()">
            &larr; Volver al menú
        </button>
    </div>

    <!-- Title -->
    <div class="text-center mb-5">
        <h3 class="fw-bold">Servicios a cargo</h3>
    </div>

    <!-- Services List -->
    <div class="d-flex flex-column align-items-center gap-3">
        <div *ngFor="let servicio of servicios" class="w-100 d-flex justify-content-center">
            <div class="service-card bg-light border px-3 py-2">
                <div class="service-data">
                    <div class="service-field d-flex align-items-center gap-2">
                        <span class="text-muted small">Electrodomestico:</span>
                        <input type="text" class="form-control form-control-sm bg-white" [value]="servicio.electrodomestico?.tipo || ''" readonly>
                    </div>
                    <div class="service-field d-flex align-items-center gap-2">
                        <span class="text-muted small">Modelo:</span>
                        <input type="text" class="form-control form-control-sm bg-white" [value]="servicio.electrodomestico?.modelo || ''" readonly>
                    </div>
                    <div class="service-field d-flex align-items-center gap-2">
                        <span class="text-muted small">Marca:</span>
                        <input type="text" class="form-control form-control-sm bg-white" [value]="servicio.electrodomestico?.marca || ''" readonly>
                    </div>
                    <div class="service-field d-flex align-items-center gap-2">
                        <span class="text-muted small">Fecha-Hora asignación:</span>
                        <input type="text" class="form-control form-control-sm bg-white" [value]="(servicio.trabajos?.[0]?.fechaDesde | date:'dd/MM/yyyy HH:mm:ss') || ''" readonly>
                    </div>
                </div>
                
                <button class="btn btn-outline-secondary btn-sm px-4" (click)="relevar(servicio)">
                    Relevar
                </button>
            </div>
        </div>

        <div *ngIf="servicios.length === 0" class="text-muted text-center mt-4">
            No tienes servicios asignados.
        </div>
    </div>
</div>
